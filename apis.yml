aid: bentley-systems
name: Bentley Systems
description: 'Bentley Systems (NASDAQ: BSY) is an infrastructure engineering software
  company providing comprehensive applications and cloud services for the design,
  construction, and operations of infrastructure across roads, bridges, rail, water,
  energy, and the built environment. Bentley exposes its developer platform through
  iTwin — a digital twin platform with 30+ REST APIs covering iModel data management,
  reality capture, project scheduling, reporting, visualization, clash detection,
  and webhooks. The company reports $1.3 billion in annual revenue, ~5,500 colleagues
  across 42 countries, and serves 42,000 accounts in 189 countries.'
url: https://github.com/api-evangelist/bentley-systems
humanURL: https://developer.bentley.com
baseURL: https://api.bentley.com
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
